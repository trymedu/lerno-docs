name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://lernodocs.vercel.app
          NEXT_PUBLIC_REPO_URL: https://github.com/trymedu/lerno
          NEXT_PUBLIC_DOCS_REPO_URL: https://github.com/trymedu/lerno-docs
